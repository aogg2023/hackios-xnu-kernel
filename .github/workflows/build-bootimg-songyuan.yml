name: build-bootimg-songyuan
on:
  workflow_dispatch:
  push:
    paths:
      - 'uefi/songyuan/**'
      - 'xnuloader/**'
      - '.github/workflows/build-bootimg-songyuan.yml'

jobs:
  bootimg:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /
      - uses: actions/checkout@v4
      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential uuid-dev nasm acpica-tools python3 python3-venv python3-pip clang lld llvm llvm-18-tools gcc-aarch64-linux-gnu libfuse3-dev || true
      - name: apply the UEFI port
        run: |
          bash uefi/songyuan/apply.sh
          echo "mu at $(git -C Mu-Silicium rev-parse --short HEAD)"
      - name: nasm shim and venv
        run: |
          D=Mu-Silicium/Mu_Basecore/BaseTools/Bin/mu_nasm_extdep
          mkdir -p $D/Linux-x86-64
          echo 'version: 20016.1.1' > $D/extdep_state.yaml
          ln -sf /usr/bin/nasm /usr/bin/ndisasm $D/Linux-x86-64/ 2>/dev/null || true
          python3 -m venv venv
          venv/bin/pip install -r Mu-Silicium/pip-requirements.txt
      - name: build uefi
        run: |
          cd Mu-Silicium
          source ../venv/bin/activate
          python3 build_uefi.py -d songyuan -r RELEASE
      - name: build the phone loader
        env:
          EXTRA_CFLAGS: '-DDIRECT_PHONE_PLAT -DPHONE_PLATFORM=platform_songyuan -DPHONE_FB_WIDTH=1200 -DPHONE_FB_HEIGHT=2608'
        run: |
          export BUILD_ID=$(git rev-parse HEAD)
          bash xnuloader/build.sh
          mkdir -p out
          cp xnuloader/loader-phone.efi out/loader-phone.efi
      - name: build the boot shim ourselves
        run: |
          cd Mu-Silicium/BootShim
          clang --target=aarch64-linux-gnu -DREQUIRES_KERNEL_HEADER=1 -DFD_BASE=0xA7100000 -DFD_SIZE=0x300000 -DPAYLOAD_BASE=0xF0000000 -DPAYLOAD_CAP=0x3700000 -c BootShim.S -o BootShim.elf
          OBJCOPY=$(command -v llvm-objcopy || command -v llvm-objcopy-18)
          [ -n "$OBJCOPY" ] || { sudo apt-get install -y llvm-tools; OBJCOPY=$(command -v llvm-objcopy || command -v llvm-objcopy-18); }
          "$OBJCOPY" -O binary BootShim.elf /tmp/BootShim.bin
          grep -q '_ShimPaint' BootShim.S || { echo "the diagnostic paint is missing from BootShim.S"; exit 1; }
          python3 - <<'EOF'
          import hashlib
          d = open('/tmp/BootShim.bin','rb').read()
          print('shim', len(d), 'bytes, paint verified by disassembly, sha', hashlib.sha256(d).hexdigest()[:16])
          EOF
      - name: pack the XNUP payload
        run: |
          python3 xnuloader/mkpayload.py -o out/usb-payload.bin loader.efi=out/loader-phone.efi --usb
          ls -l out/
      - name: pack the boot image
        env:
          UEFI_FD: Mu-Silicium/Build/songyuanPkg/RELEASE_CLANGPDB/FV/SILICIUM_UEFI.fd
          DTB: uefi/songyuan/files/Resources/DTBs/songyuan.dtb
          FD_BASE: '0xA7100000'
          FD_SIZE: '0x300000'
          PAYLOAD_BASE: '0xF0000000'
          PAYLOAD_CAP: '0x3700000'
          SHIM_BIN: /tmp/BootShim.bin
        run: |
          python3 mkxnuimg.py -p out/usb-payload.bin -o out/boot-songyuan.img
          ls -l out/boot-songyuan.img
      - name: repack as header v4
        run: |
          python3 tools/pack_v4.py out/boot-songyuan.img out/boot-songyuan-v4.img
          ls -l out/boot-songyuan-v4.img
      - uses: actions/upload-artifact@v4
        with:
          name: bootimg-songyuan
          path: |
            out/boot-songyuan.img
            out/boot-songyuan-v4.img
            out/loader-phone.efi
          if-no-files-found: error
