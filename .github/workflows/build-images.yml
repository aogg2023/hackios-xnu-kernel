name: linux-images
on: workflow_dispatch
jobs:
  images:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /
      - uses: actions/checkout@v4
      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl ca-certificates tar xz-utils make clang lld python3 perl flex bison m4 autoconf automake libtool pkg-config zlib1g-dev gawk file unzip zstd libzstd-dev bzip2 zip binutils uuid-dev libssl-dev libxml2-dev libbz2-dev liblzma-dev libncurses-dev python-is-python3 libfuse3-dev
      - name: 7zip
        run: |
          cd /tmp
          curl -sSL https://github.com/ip7z/7zip/releases/download/24.08/7z2408-linux-x64.tar.xz -o 7z2408.tar.xz
          mkdir -p /opt/7z2408 && tar -xJ -f 7z2408.tar.xz -C /opt/7z2408 --strip-components=1
          curl -sSL https://github.com/ip7z/7zip/releases/download/25.01/7z2501-linux-x64.tar.xz -o 7z2501.tar.xz
          mkdir -p /opt/7z2501 && tar -xJ -f 7z2501.tar.xz -C /opt/7z2501 --strip-components=1
          sudo ln -sf /opt/7z2408/7zz /usr/local/bin/7z
          /opt/7z2501/7zz | head -3
      - name: workspace tree
        run: |
          USERLAND_URL=https://github.com/iola1999/hackios-xnu-userland.git USERLAND_REF=k90-port bash common/setup.sh
      - name: fetch iOS 16.5
        run: |
          cd ios165
          if ! bash fetch.sh; then
            echo '--- debug 2408 listing ---'
            7z l -slt rootfs.dmg 2>&1 | head -20
            echo '--- debug 2501 listing ---'
            /opt/7z2501/7zz l -slt rootfs.dmg 2>&1 | head -20
            echo '--- extract the APFS partition ---'
            7z e -y rootfs.dmg "3 - Apple_APFS" -o/tmp/parts 2>&1 | tail -3
            ls -l /tmp/parts
            echo '--- list the extracted container ---'
            /opt/7z2501/7zz l -slt /tmp/parts/* 2>&1 | head -30
            echo '--- 2408 on the container ---'
            7z l -slt /tmp/parts/* 2>&1 | head -30
            exit 1
          fi
      - name: build images
        run: |
          SKIP="kernel loader boot" bash common/build.sh songyuan
      - name: package
        run: |
          mkdir -p dist
          ls -l userland/*.apfs
          for f in userland/system.apfs userland/root.apfs; do
            [ -f "$f" ] && split -b 1800M "$f" "dist/$(basename $f).part."
          done
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: apfs-images
          path: dist/
          if-no-files-found: error
