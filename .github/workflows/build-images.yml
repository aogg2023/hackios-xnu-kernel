name: linux-images
on: workflow_dispatch
jobs:
  images:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /
      - uses: actions/checkout@v4
      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl ca-certificates tar xz-utils make clang lld python3 perl flex bison m4 autoconf automake libtool pkg-config zlib1g-dev gawk file unzip zstd libzstd-dev bzip2 zip binutils uuid-dev libssl-dev libxml2-dev libbz2-dev liblzma-dev libncurses-dev python-is-python3 libfuse3-dev
      - name: 7zip
        run: |
          cd /tmp
          curl -sSL https://github.com/ip7z/7zip/releases/download/24.08/7z2408-linux-x64.tar.xz -o 7z2408.tar.xz
          mkdir -p /opt/7z2408 && tar -xJ -f 7z2408.tar.xz -C /opt/7z2408 --strip-components=1
          curl -sSL https://github.com/ip7z/7zip/releases/download/25.01/7z2501-linux-x64.tar.xz -o 7z2501.tar.xz
          mkdir -p /opt/7z2501 && tar -xJ -f 7z2501.tar.xz -C /opt/7z2501 --strip-components=1
          sudo ln -sf /opt/7z2408/7zz /usr/local/bin/7z
          ls -l /opt/7z2408/7zz /opt/7z2501/7zz
          /opt/7z2501/7zz | head -2
      - name: workspace tree
        run: |
          USERLAND_URL=https://github.com/iola1999/hackios-xnu-userland.git USERLAND_REF=k90-port bash common/setup.sh
      - name: probe APFS
        run: |
          echo '--- 2408 formats ---'
          /opt/7z2408/7zz i | grep -i -E 'apfs|hfs|dmg' || true
          echo '--- 2501 formats ---'
          /opt/7z2501/7zz i | grep -i -E 'apfs|hfs|dmg' || true
          echo '--- download rootfs.dmg ---'
          cd ios165
          python3 fetch-from-ipsw.py 096-04088-077.dmg rootfs.dmg.part
          mv rootfs.dmg.part rootfs.dmg
          echo '--- 2408 dmg listing ---'
          /opt/7z2408/7zz l -slt rootfs.dmg 2>&1 | head -12
          echo '--- 2501 dmg listing ---'
          /opt/7z2501/7zz l -slt rootfs.dmg 2>&1 | head -12
          echo '--- extract APFS partition ---'
          /opt/7z2408/7zz e -y rootfs.dmg "3 - Apple_APFS" -o/tmp/parts 2>&1 | tail -2
          echo '--- 2408 -tAPFS ---'
          /opt/7z2408/7zz l -slt -tAPFS "/tmp/parts/3 - Apple_APFS" 2>&1 | head -12
          echo '--- 2501 -tAPFS ---'
          /opt/7z2501/7zz l -slt -tAPFS "/tmp/parts/3 - Apple_APFS" 2>&1 | head -12
          exit 1
