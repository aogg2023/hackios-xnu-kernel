# Device profile: XIAOMI REDMI K90 PRO MAX (songyuan), Qualcomm SM8850 Canoe.
# Draft: every value that is not verified on songyuan keeps the annibale number and a TODO.
# Board values that ARE known (live device tree / Android): GIC distributor 0x17000000,
# redistributors 0x17080000 + n*0x40000, CPUs 0,0x100..0x500,0x10000,0x10100 (PSCI),
# timer 19.2 MHz, DRAM 0x80000000+2 GiB and 0x880000000+14 GiB, splash 0xfc800000+0x2b00000,
# panel 1200x2608 (cmd mode DSC).

NAME="REDMI K90 Pro Max (songyuan)"
KIND=phone
SOC="Qualcomm SM8850 (Snapdragon 8 Elite Gen 5)"

UEFI_TARGET=songyuan
UEFI_FD=
DTB=
FD_BASE=0xA7100000              # TODO(songyuan): verify the UEFI load region in the SM8850 memory map
FD_SIZE=0x300000
PAYLOAD_BASE=0xF0000000         # TODO(songyuan): verify a free RAM window for the kernel + images
PAYLOAD_CAP=0x03700000

FB_BASE=0x00000000              # the GOP framebuffer base the firmware reports
LOADER_CFLAGS="-DDIRECT_PHONE_PLAT"
WIFI_ATH11K=0

BOOTARGS="touchscreen=2 cpus=8"
DEFAULT_SECS=900
USERLAND_VARS=""
FIRMWARE=""